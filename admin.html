<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B払い計算ツール - 管理者ページ</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --border:#e2e5ea; --text:#1f2430; --sub:#6b7280;
    --accent:#3d6cf0; --accent-dark:#2b52c4; --accent-soft:#eaf0ff;
    --danger:#d64545; --danger-soft:#fdecec; --ok:#1e9e5a; --ok-soft:#e7f8ef; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.6;padding-bottom:60px;
  }
  .app{max-width:900px;margin:0 auto;padding:24px 16px 80px;}
  header{margin-bottom:24px;}
  header h1{font-size:22px;margin:0 0 4px;}
  header p{margin:0;color:var(--sub);font-size:13px;}
  section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 20px;margin-bottom:16px;}
  section h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:6px;}
  section h2::before{content:"▼";color:var(--accent);font-size:12px;}
  .note{font-size:12px;color:var(--sub);margin:4px 0 10px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field input[type=text]{
    border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:15px;width:260px;max-width:100%;
  }
  table{width:100%;min-width:520px;border-collapse:collapse;font-size:14px;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
  th{font-size:12px;color:var(--sub);font-weight:600;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .btn{
    border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 14px;
    font-size:13px;cursor:pointer;color:var(--text);text-decoration:none;display:inline-block;
  }
  .btn:hover{background:#f0f2f5;}
  .btn.small{padding:4px 10px;font-size:12px;}
  .btn.danger{color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .row-actions{white-space:nowrap;}
  .empty-hint{color:var(--sub);font-size:13px;padding:8px 2px;}
  .field input[type=password]{
    border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:15px;width:260px;max-width:100%;
  }
  .link-result{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .link-result input{
    flex:1;min-width:220px;border:1px solid var(--border);border-radius:8px;padding:9px 10px;
    font-size:13px;background:#f8f9fb;color:var(--text);
  }
  .copied-msg{color:var(--ok);font-size:12px;margin-left:4px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>B払い計算ツール - 管理者ページ</h1>
    <p>全担当者が保存した計算書を一覧・編集できます。</p>
  </header>

  <section id="section-login">
    <h2>管理者ログイン</h2>
    <div class="field">
      <label>合言葉を入力してください</label>
      <input type="password" id="input-passphrase" placeholder="合言葉" autocomplete="off">
    </div>
    <button class="btn primary" id="btn-login">開く</button>
    <p class="note" id="login-error" style="display:none;color:var(--danger);">合言葉が違います。もう一度お試しください。</p>
  </section>

  <section id="section-generate-link" style="display:none;">
    <h2>入口リンクを発行</h2>
    <p class="note">担当者名を入力すると、その人専用の計算ツールへの入口リンクが作成されます。作成したリンクをコピーして、LINEやメールなどでその人に送ってください。</p>
    <div class="field">
      <label>担当者名</label>
      <input type="text" id="input-owner-name" placeholder="例：田中">
    </div>
    <button class="btn primary" id="btn-generate-link">リンクを作成</button>
    <div class="link-result" id="link-result" style="display:none;">
      <input type="text" id="generated-link" readonly>
      <button class="btn small" id="btn-copy-link">コピー</button>
      <span class="copied-msg" id="copied-msg" style="display:none;">コピーしました</span>
    </div>
  </section>

  <section id="section-list" style="display:none;">
    <h2>保存された計算書一覧</h2>
    <div class="field">
      <label>担当者・名前で絞り込み</label>
      <input type="text" id="input-filter" placeholder="例：田中、〇〇商店">
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>担当者</th>
          <th>名前</th>
          <th style="width:170px;">保存日時</th>
          <th style="width:90px;"></th>
          <th style="width:60px;"></th>
        </tr></thead>
        <tbody id="quotes-tbody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  const REMOTE_API_URL = "https://script.google.com/macros/s/AKfycbw8OLWBJiXvXJ-c8SpDMtmTx440lQSB4ZrNIT_Z9CHMYpOOkERr8AXbBVjkmCpmPcwJdw/exec";
  const REMOTE_API_TOKEN = "YGfcWJDnrN8fXEs2m4ru0AOGFR-z63KW";
  const ADMIN_TOKEN = "admin-Io6f7ov7CT4";
  const ADMIN_PASSPHRASE = "Udon";
  const ADMIN_AUTH_KEY = "ltob_admin_authed_v1";

  function showList(){
    document.getElementById("section-login").style.display = "none";
    document.getElementById("section-generate-link").style.display = "";
    document.getElementById("section-list").style.display = "";
    refresh();
  }

  function tryLogin(){
    const input = document.getElementById("input-passphrase");
    if(input.value === ADMIN_PASSPHRASE){
      try{ localStorage.setItem(ADMIN_AUTH_KEY, "1"); }catch(e){}
      document.getElementById("login-error").style.display = "none";
      showList();
    }else{
      document.getElementById("login-error").style.display = "";
      input.value = "";
      input.focus();
    }
  }

  let authed = false;
  try{ authed = localStorage.getItem(ADMIN_AUTH_KEY) === "1"; }catch(e){}

  if(authed){
    showList();
  }else{
    document.getElementById("btn-login").addEventListener("click", tryLogin);
    document.getElementById("input-passphrase").addEventListener("keydown", (e) => {
      if(e.key === "Enter") tryLogin();
    });
  }

  let quotes = [];

  async function fetchQuotes(){
    try{
      const res = await fetch(REMOTE_API_URL + "?type=quotes");
      const data = await res.json();
      return Array.isArray(data.quotes) ? data.quotes : [];
    }catch(e){
      return null;
    }
  }
  async function postQuoteAction(action, payload){
    try{
      const res = await fetch(REMOTE_API_URL, {
        method: "POST",
        body: JSON.stringify(Object.assign({ type: "quotes", token: REMOTE_API_TOKEN, action }, payload))
      });
      const data = await res.json();
      return !!(data && data.ok);
    }catch(e){
      return false;
    }
  }

  function editUrl(id){
    const url = new URL("index.html", window.location.href);
    url.searchParams.set("u", ADMIN_TOKEN);
    url.searchParams.set("loadQuote", id);
    return url.toString();
  }

  function render(){
    const tbody = document.getElementById("quotes-tbody");
    const filter = document.getElementById("input-filter").value.trim().toLowerCase();
    const filtered = quotes.filter(q =>
      !filter ||
      (q.owner || "").toLowerCase().includes(filter) ||
      (q.name || "").toLowerCase().includes(filter)
    );
    tbody.innerHTML = "";
    if(filtered.length === 0){
      tbody.innerHTML = '<tr><td colspan="5" class="empty-hint">保存された計算書がありません。</td></tr>';
      return;
    }
    const sorted = [...filtered].sort((a, b) => b.savedAt - a.savedAt);
    sorted.forEach(q => {
      const tr = document.createElement("tr");

      const tdOwner = document.createElement("td");
      tdOwner.textContent = q.owner || "(不明)";

      const tdName = document.createElement("td");
      tdName.textContent = q.name;

      const tdDate = document.createElement("td");
      tdDate.textContent = new Date(q.savedAt).toLocaleString("ja-JP");

      const tdOpen = document.createElement("td");
      const openLink = document.createElement("a");
      openLink.className = "btn small";
      openLink.href = editUrl(q.id);
      openLink.textContent = "詳細を開く";
      tdOpen.appendChild(openLink);

      const tdDel = document.createElement("td");
      tdDel.className = "row-actions";
      const delBtn = document.createElement("button");
      delBtn.className = "btn small danger";
      delBtn.textContent = "削除";
      delBtn.addEventListener("click", async () => {
        if(!confirm("「" + q.name + "」（" + (q.owner || "不明") + "）を削除します。よろしいですか？")) return;
        const ok = await postQuoteAction("delete", { id: q.id });
        if(ok){
          await refresh();
        }else{
          alert("削除に失敗しました。通信状況をご確認ください。");
        }
      });
      tdDel.appendChild(delBtn);

      tr.appendChild(tdOwner);
      tr.appendChild(tdName);
      tr.appendChild(tdDate);
      tr.appendChild(tdOpen);
      tr.appendChild(tdDel);
      tbody.appendChild(tr);
    });
  }

  async function refresh(){
    const result = await fetchQuotes();
    if(result === null){
      document.getElementById("quotes-tbody").innerHTML =
        '<tr><td colspan="5" class="empty-hint">計算書一覧を取得できませんでした（通信状況をご確認ください）。</td></tr>';
      return;
    }
    quotes = result;
    render();
  }

  document.getElementById("input-filter").addEventListener("input", render);

  function generateLink(){
    const nameInput = document.getElementById("input-owner-name");
    const name = nameInput.value.trim();
    if(!name){
      nameInput.focus();
      return;
    }
    const url = new URL("index.html", window.location.href);
    url.searchParams.set("u", name);
    document.getElementById("generated-link").value = url.toString();
    document.getElementById("link-result").style.display = "";
    document.getElementById("copied-msg").style.display = "none";
  }

  document.getElementById("btn-generate-link").addEventListener("click", generateLink);
  document.getElementById("input-owner-name").addEventListener("keydown", (e) => {
    if(e.key === "Enter") generateLink();
  });
  document.getElementById("btn-copy-link").addEventListener("click", async () => {
    const field = document.getElementById("generated-link");
    field.select();
    try{
      await navigator.clipboard.writeText(field.value);
    }catch(e){
      document.execCommand("copy");
    }
    const msg = document.getElementById("copied-msg");
    msg.style.display = "";
    setTimeout(() => { msg.style.display = "none"; }, 2000);
  });
})();
</script>
</body>
</html>
